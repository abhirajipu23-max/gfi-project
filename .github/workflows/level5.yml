name: Running level 5

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    environment: api_key

    env:
      API_KEY1: ${{ secrets.API_KEY1 }}
      API_KEY2: ${{ secrets.API_KEY2 }}
      API_KEY3: ${{ secrets.API_KEY3 }}
      API_KEY4: ${{ secrets.API_KEY4 }}
      API_KEY5: ${{ secrets.API_KEY5 }}
      API_KEY6: ${{ secrets.API_KEY6 }}
      SUPABASE_URL: ${{secrets.SUPABASE_URL}}
      SUPABASE_KEY: ${{secrets.SUPABASE_KEY}}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Run script
        run: python level5/level5.py